<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source Status</title>
  <meta name="description" content="Health of every source crawled for the academic positions search: last run, items, new and removed postings, errors.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <h1>Source status</h1>
    <p class="status-summary" id="summary"></p>
    <p class="lede" id="lede">Loading the last crawl's report…</p>
  </header>
  <main>
    <ul class="warnings" id="warnings" hidden></ul>
    <div class="table-wrap">
      <table class="status" id="sources">
        <thead><tr>
          <th scope="col">Source</th><th scope="col">State</th><th scope="col" class="num">Items</th>
          <th scope="col" class="num">New</th><th scope="col" class="num">Removed</th>
          <th scope="col">Last OK</th><th scope="col">Note</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <h2 class="sub">robots.txt</h2>
    <div class="table-wrap"><table class="status" id="robots"><thead><tr><th scope="col">Host</th><th scope="col">robots.txt</th></tr></thead><tbody></tbody></table></div>
    <h2 class="sub">Extra CA certificates</h2>
    <div class="table-wrap"><table class="status" id="certs"><thead><tr><th scope="col">File</th><th scope="col">Certificate</th><th scope="col">Expires</th></tr></thead><tbody></tbody></table></div>
  </main>
  <footer class="foot">
    <p><a href="./">Search</a> · <a href="https://github.com/bhaskarspace/academic-jobs/issues?q=label%3Asource-health">Health issues</a> ·
      <a href="https://github.com/bhaskarspace/academic-jobs">Source code</a></p>
  </footer>
  <script type="module" src="status.js"></script>
</body>
</html>
