# Concepts and variants for matching. Bhaskar curates this file: keep comments and ordering.
#
# variants: groups of surface words that should match each other although Porter2 stems them
# apart (holography -> holographi, holographic -> holograph). The first word's stem is canonical.
# Applied identically when indexing and when querying.
# Every build writes candidate pairs to data/variant-candidates.yaml (also in .out/ locally):
# move a pair here to approve it, or to `notVariants:` below to stop it being suggested.
variants:
  - [postdoc, postdoctoral, post-doctoral, postdocs]
  - [professor, professorship]
  - [holography, holographic, holographically]
  - [chaos, chaotic]
  - [theory, theoretical, theorist, theorists]
  - [gravity, gravitational]
  - [cosmology, cosmological]
  - [topology, topological]
  - [geometry, geometric, geometrical]
  - [symmetry, symmetric]
  - [statistics, statistical]
  - [mathematics, mathematical]
  - [ergodic, ergodicity]
  - [integrable, integrability]
  - [matrix, matrices]
  - [superconductivity, superconductor, superconducting]

# Pairs the variant review rejected: never suggested again.
notVariants: []

# concepts: what a topic search expands to.
#   query:  words that invoke the concept. Each also counts as a direct match, anywhere.
#   fields: arXiv-style fields where an expanded hit counts (field gating). A posting matched only
#           through `terms` must have one of these fields, so "inflation" (cosmology) skips
#           economics postings and "Lyapunov" (chaos) skips control-engineering ones.
#           `physics` is the broad tag for physics departments without a finer subject.
#           Postings in these fields (other than `physics`) that name no topic are listed under
#           the results as general calls.
#   terms:  member words and phrases. Phrases match consecutive words; hyphens are optional
#           ("many-body localization" also matches "many body localization").
#   weak:   members too broad to count on their own ("thermalization" also turns up in plasma and
#           accelerator ads). They count next to the query word, another member, or a second weak one.
# A literal hit of the typed word ranks above a hit through a member term.
concepts:
  chaos:
    label: quantum chaos
    query: [chaos, quantum chaos, chaotic]
    fields: [hep-th, cond-mat, quant-ph, math-ph, nlin, gr-qc, physics]
    terms: [scrambling, OTOC, OTOCs, out-of-time-order, out-of-time-ordered, Lyapunov exponent,
      butterfly velocity, random matrix theory, spectral form factor, SYK, Sachdev-Ye-Kitaev,
      eigenstate thermalization, quantum ergodicity, many-body localization, many-body localized, MBL,
      operator growth, operator spreading, Krylov complexity]
    weak: [Lyapunov, random matrix, RMT, level statistics, thermalization, ergodicity, nonlinear dynamics]

  holography:
    label: holography
    query: [holography, holographic, gauge/gravity duality, gauge-gravity duality]
    fields: [hep-th, gr-qc, cond-mat, quant-ph, math-ph, physics]
    terms: [AdS/CFT, anti-de Sitter, gauge/gravity, celestial holography, flat space holography,
      bulk reconstruction, entanglement wedge, Ryu-Takayanagi, holographic entanglement,
      holographic complexity, JT gravity, Jackiw-Teitelboim, AdS2, AdS3, AdS4, AdS5, dS/CFT]

  black-holes:
