  - [gravity, gravitational]
  - [cosmology, cosmological]
  - [topology, topological]
  - [geometry, geometric, geometrical]
  - [symmetry, symmetric]
  - [statistics, statistical]
  - [mathematics, mathematical]
  - [ergodic, ergodicity]
  - [integrable, integrability]

