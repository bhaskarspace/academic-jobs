name: probe
# One-off / on-demand reachability check of every source URL from a GitHub-hosted runner.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated probe ids (empty = all)'
        required: false
        default: ''
      args:
        description: 'Extra probe.mjs flags, e.g. --html-headers'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Last good robots.txt copies, used when a host's robots.txt is unreachable (RFC 9309).
      - uses: actions/cache/restore@v4
        with:
          path: .probe-robots.json
          key: probe-robots-${{ github.run_id }}
          restore-keys: probe-robots-
      - name: Probe (Node fetch)
        env:
          ONLY: ${{ inputs.only }}
          ARGS: ${{ inputs.args }}
        run: |
          node tools/probe.mjs --label runner --json probe-runner.json --md probe-runner.md --allowed probe-allowed.txt --robots-cache .probe-robots.json ${ONLY:+--only "$ONLY"}
          if [ -n "$ARGS" ]; then node tools/probe.mjs --label runner-headers --json probe-runner-headers.json --md probe-runner-headers.md --robots-cache .probe-robots.json ${ONLY:+--only "$ONLY"} $ARGS; fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .probe-robots.json
          key: probe-robots-${{ github.run_id }}
      - name: Probe (curl, for comparison; only URLs robots.txt allows)
        run: |
          while read -r u; do
            printf '%s\t%s\n' "$(curl -s -o /dev/null -A 'academic-jobs/0.1 (+https://github.com/bhaskarspace/academic-jobs/issues)' \
              --connect-timeout 15 -m 40 -w '%{http_code} %{time_total}s ssl=%{ssl_verify_result}' "$u" || echo ERR)" "$u"
            sleep 1
          done < probe-allowed.txt | tee probe-runner-curl.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: probe-runner
          path: probe-runner*
