# Institution aliases, used to block cross-source duplicate detection (crawler/lib/dedupe.mjs) and
# to show a full name where a source gives only an abbreviation.
# INSPIRE names come from its institution records (crawler/adapters/inspire.mjs); add an alias here
# only when that record has no full name or the two sources still disagree.
#   canonical name: [variant, ...]      matched case- and accent-insensitively, on the whole
#                                       institution string or on its part before the first comma
# display: what the card shows for a generic institution name. `name` is the whole name as INSPIRE or
# AJO gives it (case- and accent-insensitive); the rule fires only when `when` (a regex) matches the
# posting's INSPIRE ICN, AJO city or country, so other institutes of that name keep theirs. Display
# only (crawler/lib/display.mjs, after dedupe); the source's name stays searchable.
display:
  - name: Institute of Physics
    when: 'Bhubaneswar'
    show: "Institute of Physics, Bhubaneswar"

aliases:
  University of Oxford: [U. Oxford (main), Oxford U., Oxford U]
  New York University: [New York U. (main), New York U., NYU]
  College of William & Mary: [Coll. William and Mary, William & Mary, William and Mary]
  University of Copenhagen: [Bohr Inst., Niels Bohr Institute]
  "Institute of Theoretical Physics, Chinese Academy of Sciences": ["Beijing, Inst. Theor. Phys.", ITP-CAS]
  California Institute of Technology: [Caltech, "Caltech, Pasadena (main)"]
  Washington University in St. Louis: [WUSTL, "Washington U., St. Louis"]
  Stanford University: [Stanford U., SLAC]
