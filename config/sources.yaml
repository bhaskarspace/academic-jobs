# Source registry: one entry per source or page. See CLAUDE.md "Adding a source".
# Every entry must have a row in docs/AUDIT.md with its robots/ToS verdict.
#
# Common keys:
#   id, name, adapter, url, institution, country (ISO-3166 alpha-2)
#   runner:      actions | mac        (default actions)
#   timeoutMin:  watchdog for the whole source (default 10)
#   crawlDelay:  seconds between requests to this host (robots.txt crawl-delay wins if larger)
#   permission:  only if a webmaster has given written consent to crawl paths robots.txt disallows:
#                { date: YYYY-MM-DD, from: "...", how: "email ..." }
#   tls:         never "insecure" for a missing intermediate; put the PEM in config/ca/ instead.
#   adapter: link-out  listed on the status page (and later in the link-out row), never crawled;
#                      `note` says why.

sources:
  - id: inspire
    name: INSPIRE-HEP
    adapter: inspire
    url: https://inspirehep.net/api/jobs?q=status:open&sort=mostrecent&size=100
    # API limit is 15 requests / 5 s; one request a second is well inside it.
    crawlDelay: 1

  - id: ajo
    name: AcademicJobsOnline
    adapter: ajo
    url: https://academicjobsonline.org/ajo/public_job_boards
    pageSize: 500
    # robots.txt: Crawl-delay 5 (applied automatically)

  - id: mathjobs
    name: MathJobs
    adapter: ajo          # same software and JSON feed as AJO
    url: https://www.mathjobs.org/jobs/public_job_boards
    pageSize: 500
    # robots.txt is empty (allow all); default 2 s between requests.

  - id: iiser-pune-openings
    name: IISER Pune
    adapter: html-list
    institution: IISER Pune
    country: IN
    url: https://www.iiserpune.ac.in/opportunities/openings
    timeoutMin: 30            # a first run fetches ~200 detail pages and up to 120 PDFs at one per 2 s
    list:
      item: ul.openings-list > li
      title: div.title h5 a
      link: div.title h5 a
      ref: div.reference-id
      dates:
        sel: div.date
        label: strong
        map: { last date: deadline, published: posted }
    detail:
      text: main .rich-text
      rows: table.job-details-table tr      # <th>label</th><td>value</td>
      rowMap: { last date: deadline, advertisement number: ref }
      pdf: a.download-link

  - id: iiser-pune-faculty
    name: IISER Pune
    adapter: html-page
    institution: IISER Pune
    country: IN
    url: https://www.iiserpune.ac.in/opportunities/academic
    title: IISER Pune faculty positions (rolling advertisements)
    categories: [faculty]
    text: main .rich-text

  - id: iiser-pune-postdoc
    name: IISER Pune
    adapter: html-page
    institution: IISER Pune
    country: IN
    url: https://www.iiserpune.ac.in/opportunities/postdoctoral-research
    title: IISER Pune Postdoctoral Research Associate (PDRA) and ANRF-NPDF positions
    categories: [postdoc, fellowship]
    text: main .rich-text

  - id: ncbs
    name: NCBS Bangalore
    adapter: link-out
    url: https://www.ncbs.res.in/careers
    institution: National Centre for Biological Sciences, Bengaluru
    country: IN
    note: Never reachable from GitHub runners (connection timeouts on every probe, robots.txt included); answers from a residential connection. Link-out rather than a Mac fallback.

  # --- Phase 6: all IISERs -------------------------------------------------------------------
  # Admissions sources (PhD / integrated PhD) carry `admissions: true`: fixed PhD category, and
  # `fields` naming the departments the call covers; "physics" expands to the physics subfields so
  # the calls appear in the general-calls section of a physics topic search. `emptyOk`: a page
  # with no open round between intakes is not a breakage.

  - id: iiser-pune-phd-admissions
    name: IISER Pune
    adapter: html-page
    institution: IISER Pune
    country: IN
    url: https://www.iiserpune.ac.in/education/admissions/phd-programme
    title: IISER Pune PhD programme admissions
    text: .rich-text
    textAll: true
    rolling: false
    admissions: true
    categories: [phd]
    fields: [physics, math, chem, bio]

  - id: iiser-pune-iphd-admissions
    name: IISER Pune
    adapter: html-page
    institution: IISER Pune
    country: IN
    url: https://www.iiserpune.ac.in/education/admissions/integrated-phd-programme
    title: IISER Pune Integrated PhD (i-PhD) admissions
    text: .rich-text
    textAll: true
    rolling: false
    admissions: true
    categories: [phd]
    fields: [physics, math, chem, bio]

  - id: iiser-kolkata-projects
    name: IISER Kolkata
    adapter: html-table
    institution: IISER Kolkata
    country: IN
    url: https://www.iiserkol.ac.in/web/advertisements
    # Current openings only (older ones move to /web/advertisements/archive). The row links
    # straight to the advert PDF; "Contact Person" is the PI.
    columns: { name of the post: title, contact person: pi, department: subject, last date: deadline, project position details: pdf }

  - id: iiser-kolkata-postdoc
    name: IISER Kolkata
    adapter: html-page
    institution: IISER Kolkata
    country: IN
    url: https://apply.iiserkol.ac.in/pdf/
    title: IISER Kolkata Post-doctoral Fellowship (PDF) Programme
    text: body
    categories: [postdoc, fellowship]

  - id: iiser-kolkata-admissions
    name: IISER Kolkata
    adapter: html-list
    institution: IISER Kolkata
    country: IN
    url: https://www.iiserkol.ac.in/web/admission
    # The "Click Here" links carry per-session encrypted tokens (404 when fetched later), so the
    # posting links to the admissions page itself.
    list: { item: .inner-contain, title: h3, body: p }
    match: 'ph\.?\s?d'
    admissions: true
    emptyOk: true
    categories: [phd]
    fields: [physics, math, chem, bio]

  - id: iiser-mohali-projects
    name: IISER Mohali
    adapter: rss
    institution: IISER Mohali
    country: IN
    url: https://web.iisermohali.ac.in/noticeportal/iiserm-project-openings?format=feed&type=rss
    # The feed carries the full advert text (deadline in prose) and its newest 10 items.

  - id: iiser-mohali-admissions
    name: IISER Mohali
    adapter: html-list
    institution: IISER Mohali
    country: IN
    url: https://www.iisermohali.ac.in/admission-news
    list: { item: '.item-page li', title: a, link: a }
    match: 'ph\.?\s?d'
    exclude: 'result|shortlist|selected|merit|waitlist|interview schedule'
    detail: { text: '.item-page' }
    admissions: true
    emptyOk: true
    categories: [phd]
    fields: [physics, math, chem, bio]

  - id: iiser-tvm-openings
    name: IISER TVM
    adapter: html-table
    institution: IISER Thiruvananthapuram
    country: IN
    url: https://www.iisertvm.ac.in/openings
    table: table.data_table
    columns: { title: [title, link], publish date: posted, last date: deadline }
    # 25 rows a page, newest first, ~31 pages: read until a page has no open advert.
    pages: { next: 'https://www.iisertvm.ac.in/openings/index/{n}?', max: 10 }
    detail:
      text: .cms_content
      pdf: 'a[href*="/files/read/"]'     # handler URLs without .pdf; the PDF step sniffs the type

  - id: iiser-tvm-admissions
    name: IISER TVM
    adapter: html-list
    institution: IISER Thiruvananthapuram
    country: IN
    url: https://www.iisertvm.ac.in/pages/admission
    list: { item: .card_row, title: a, link: a }
    match: 'ph\.?\s?d'
    exclude: 'result|shortlist|selected|merit|waitlist'
    detail:
      text: .cms_content
      pdf: 'a[href*="/files/read/"]'
    admissions: true
    emptyOk: true
    categories: [phd]
    fields: [physics, math, chem, bio]

  - id: iiser-berhampur-contractual
    name: IISER Berhampur
    adapter: html-list
    institution: IISER Berhampur
    country: IN
    url: https://www.iiserbpr.ac.in/opportunity/contractual
    # One table per advert: a header row "Advertisement Number: … , Dated: … Last Date: …", then
    # one row per post (#, Post, Department, Updates with the PDFs). The page keeps every advert
    # since 2024, so most are closed; PDFs are fetched only for open ones.
    list: &bpr-list
      item: table
      title: 'tbody tr td:nth-child(2)'
      titleAll: true
      subject: 'tbody tr td:nth-child(3)'
      pdf: 'a[href$=".pdf"]'
      labels: { sel: 'thead tr:first-child td', map: { advertisement number: ref, dated: posted, last date: deadline } }

  - id: iiser-berhampur-postdoc
    name: IISER Berhampur
    adapter: html-list
    institution: IISER Berhampur
    country: IN
    url: https://www.iiserbpr.ac.in/opportunity/post-doc
    list: *bpr-list
    categories: [postdoc]

  - id: iiser-berhampur-admissions
    name: IISER Berhampur
    adapter: html-list
    institution: IISER Berhampur
    country: IN
    url: https://www.iiserbpr.ac.in/opportunity/phd-admissions
    list:
      item: table
      title: '@lead'
      pdf: 'a[href$=".pdf"]'
      labels: { sel: 'thead tr:first-child td', map: { dated: posted, last date: deadline } }
    match: 'ph\.?\s?d'
    exclude: 'result|shortlist|selected|merit|waitlist'
    admissions: true
    emptyOk: true
    categories: [phd]
    fields: [physics, math, chem, bio]

  - id: iiser-bhopal-pdf
    name: IISER Bhopal
    adapter: html-table
    institution: IISER Bhopal
    country: IN
    url: https://www.iiserb.ac.in/dofa/vacancy
    # robots.txt disallows /assets/* and /assets_external/tender/*; the adverts sit under
    # /assets_external/dofa/, which is allowed.
    columns: { title: title, download: pdf, last date: deadline }
    skip: 'annexure|application form|proforma'
    categories: [postdoc]

  - id: iiser-bhopal-rnd
    name: IISER Bhopal
    adapter: html-table
    institution: IISER Bhopal
    country: IN
    url: https://www.iiserb.ac.in/careers/rnd
    columns: { post name: title, department: subject, advertisement: pdf, last date: deadline }

  - id: iiser-bhopal-admissions
    name: IISER Bhopal
    adapter: html-list
    institution: IISER Bhopal
    country: IN
    url: https://phdadmission.iiserb.ac.in/
    # One card per department round ("Walk-in Interview – 2nd Round of PhD Admission,
    # Department of Chemistry"); fields come from the department line, not a fixed list.
    list: { item: .admission-card, title: .admission-header, subject: .text-sub-title, body: .admission-body }
    admissions: true
    emptyOk: true
    categories: [phd]

  - id: iiser-tirupati-projects
    name: IISER Tirupati
    adapter: html-table
    institution: IISER Tirupati
    country: IN
    url: https://www.iisertirupati.ac.in/jobs/?search_keywords=&selected_category=pa-pf&selected_jobtype=-1&selected_location=-1
    columns: { job title: [title, link], due date: deadline }
    # "Advertisement No.: (92/2026) – Recruitment for the post of “Project Assistant” under …"
    titleRef: '^\s*Advertisement\s+No\.?\s*:?\s*\(?([^)–-]+?)\)?\s*[–-]\s*(?:Recruitment\s+for\s+the\s+post\s+of\s+)?'
    pages: { next: 'https://www.iisertirupati.ac.in/jobs/?page={n}%2F&search_keywords&selected_category=pa-pf&selected_jobtype=-1&selected_location=-1', max: 10 }
    detail: &tirupati-detail          # the page holds only the title and buttons; the PDF is the advert
      pdf: 'section.jd-page a[href$=".pdf"]'

  - id: iiser-tirupati-postdoc
    name: IISER Tirupati
    adapter: html-table
    institution: IISER Tirupati
    country: IN
    url: https://www.iisertirupati.ac.in/jobs/?search_keywords=&selected_category=pdrf&selected_jobtype=-1&selected_location=-1
    columns: { job title: [title, link], due date: deadline }
    titleRef: '^\s*Advertisement\s+No\.?\s*:?\s*\(?([^)–-]+?)\)?\s*[–-]\s*(?:Recruitment\s+for\s+the\s+post\s+of\s+)?'
    pages: { next: 'https://www.iisertirupati.ac.in/jobs/?page={n}%2F&search_keywords&selected_category=pdrf&selected_jobtype=-1&selected_location=-1', max: 10 }
    detail: *tirupati-detail
    categories: [postdoc]

  - id: iiser-tirupati-phd-admissions
    name: IISER Tirupati
    adapter: html-page
    institution: IISER Tirupati
    country: IN
    url: https://www.iisertirupati.ac.in/admission-phd/
    text: .entry-content
    # The page stacks rounds ("ADMISSION TO Ph.D. PROGRAM – JANUARY 2027", "… JANUARY 2024").
    sections: { heading: h4, match: 'admission to', skipOld: true }
    titlePrefix: 'IISER Tirupati: '
    rolling: false
    admissions: true
    emptyOk: true
    categories: [phd]
    fields: [physics, math, chem, bio]

  - id: iiser-tirupati-iphd-admissions
    name: IISER Tirupati
    adapter: html-page
    institution: IISER Tirupati
    country: IN
    url: https://www.iisertirupati.ac.in/admission-iphd/
    text: .entry-content
    sections: { heading: h4, match: 'admission to', skipOld: true }
    titlePrefix: 'IISER Tirupati: '
    rolling: false
    admissions: true
    emptyOk: true
    categories: [phd]
    fields: [physics, math, chem, bio]

  # --- Phase 7: research institutes ----------------------------------------------------------
  # Checked 2026-11-24 from the Mac and a runner (docs/AUDIT.md "Research institutes (Phase 7)").
  - id: iisc-contractual
    name: IISc Bangalore
    adapter: html-table
    institution: Indian Institute of Science
    country: IN
    url: https://www.iisc.ac.in/careers/contractual-positions/
    table: table.tablepress
    columns: { advt. no: ref, post: title, department: subject, detailed advertisement: [pdf, link], application closing date: deadline, application start date: posted }

  - id: icts-opportunities
    name: ICTS Bengaluru
    adapter: html-list
    institution: International Centre for Theoretical Sciences
    country: IN
    url: https://www.icts.res.in/opportunities
    # robots.txt Crawl-delay 10 (applied automatically). /academic/postdoctoral-fellowships repeats
    # the same calls, so it isn't a second source.
    list: { item: 'table.views-view-grid article.news', title: '.news-heading a', link: '.news-heading a', body: '.news-content', dates: { sel: '.news-date', map: { '': posted } } }
    exclude: 'non-academic|tender|result|selected'
    detail: { text: '.description' }

  # IMSc: Cloudflare answered the runner with 403 on these pages too in the Phase 7 branch crawl
  # (2026-11-24 08:54 UTC), though the probe two hours earlier got 200. Kept configured (and
  # fixture-tested) but disabled; `imsc-programmes` below is the link-out. Re-enable if it answers.
  - id: imsc-postdoc
    enabled: false
    name: IMSc Chennai
    adapter: html-page
    institution: The Institute of Mathematical Sciences
    country: IN
    url: https://www.imsc.res.in/post_doctoral_programme
    title: IMSc post-doctoral fellowships (theoretical physics, mathematics, theoretical computer science, computational biology)
    categories: [postdoc]
    fields: [hep-th, cond-mat, math-ph, math, cs]
    text: '.node-main-content .field-name-body'
    # "Applications are accepted all year round."

  - id: imsc-faculty
    enabled: false
    name: IMSc Chennai
    adapter: html-page
    institution: The Institute of Mathematical Sciences
    country: IN
    url: https://www.imsc.res.in/facultyrecruitment
    title: IMSc faculty positions
    categories: [faculty]
    text: '.node-main-content .field-name-body'
    rolling: false

  - id: imsc-programmes
    name: IMSc Chennai
    adapter: link-out
    url: https://www.imsc.res.in/post_doctoral_programme
    institution: The Institute of Mathematical Sciences
    country: IN
    note: Cloudflare answers GitHub runners with 403 (the postdoc and faculty pages on 24 Nov; other_positions on every probe). The postdoc call is a standing one ("applications are accepted all year round"); the faculty page is /facultyrecruitment.

  - id: imsc-other
    name: IMSc Chennai (other positions)
    adapter: link-out
    url: https://www.imsc.res.in/other_positions
    institution: The Institute of Mathematical Sciences
    country: IN
    note: Cloudflare answers the crawler (Node) with a 403 challenge on this page only, from GitHub runners, with or without ordinary Accept headers, while curl gets 200; a client-fingerprint rule we don't work around. The postdoc and faculty pages answer normally.

  - id: iop
    name: IOP Bhubaneswar
    adapter: rss
    institution: Institute of Physics, Bhubaneswar
    country: IN
    url: https://www.iopb.res.in/feed/?post_type=job_opening
    exclude: 'short-?listed|result|selected candidates|tradesman'

  - id: sinp
    name: SINP Kolkata
    adapter: html-table
    institution: Saha Institute of Nuclear Physics
    country: IN
    url: https://www.saha.ac.in/web/job-opportunities
    # The server answers 500 to a gzip/deflate Accept-Encoding (with the full page as the body).
    headers: { Accept-Encoding: identity }
    columns: { title: [title, link, pdf], published date: posted }
    exclude: 'merit list|result|selected|short-?listed|interview schedule|list of (eligible|candidates)|addendum|corrigendum|cancell|hindi version|application portal|application proforma|^notice'
    skipOld: true
    maxAgeDays: 180     # the page keeps undated adverts from 2022 on; their PDFs are gone (403)

  - id: rri-postdoc
    name: RRI Bengaluru
    adapter: html-page
    institution: Raman Research Institute
    country: IN
    url: https://www.rri.res.in/careers/post-doctoral-fellowships
    title: RRI post-doctoral fellowships
    categories: [postdoc]
    fields: [astro-ph, cond-mat, quant-ph, physics]
    text: 'article .text-formatted'

  - id: bose
    name: S.N. Bose Centre Kolkata
    adapter: html-table
    institution: S. N. Bose National Centre for Basic Sciences
    country: IN
    url: https://www.bose.res.in/InfoAnnouncements/JobOpenings.jsp?type=ACADEMIC
    table: table.data-tbl
    columns: { job position: title, ref. no: ref, publish date: posted, closing date: deadline, download: [pdf, link] }

  - id: iacs
    name: IACS Kolkata
    adapter: link-out
    url: https://iacs.res.in/research-associate
    institution: Indian Association for the Cultivation of Science
    country: IN
    note: robots.txt lists the research-associate and faculty-position pages under Disallow lines written as full URLs (invalid under RFC 9309, so a parser ignores them). The intent to keep crawlers out is clear, so we don't crawl.

  - id: iucaa
    name: IUCAA Pune
    adapter: html-table
    institution: Inter-University Centre for Astronomy and Astrophysics
    country: IN
    url: https://www.iucaa.in/en/opportunities
    # Two tables matter: "Current Openings" (with a deadline column) and "Positions for which we
    # are accepting applications throughout the year" (rolling; its prose still names old rounds).
    columns: { name of the post: title, advertisement details: [body, pdf, link], deadline for submission: deadline }
    pdfLinks: '\.pdf($|\?)'
    rollingTables: 'throughout the year'
    exclude: 'administrative|section officer|accounts|engineer|technician|driver|clerk|devops'

  - id: tifrh-postdoc
    name: TIFR Hyderabad
    adapter: html-table
    institution: Tata Institute of Fundamental Research, Hyderabad
    country: IN
    url: https://www.tifrh.res.in/careers/post-doctoral-and-visiting-positions/
    columns: { post & lab: title, advt/poster: [link, pdf] }
    categories: [postdoc]

  - id: tifrh-jrf
    name: TIFR Hyderabad
    adapter: html-table
    institution: Tata Institute of Fundamental Research, Hyderabad
    country: IN
    url: https://www.tifrh.res.in/careers/jrf-srf-positions/
    columns: { post & lab: title, advt/poster: [link, pdf] }
    emptyOk: true

  - id: ncra-postdoc
    name: NCRA-TIFR Pune
    adapter: html-list
    institution: National Centre for Radio Astrophysics
    country: IN
    url: https://www.ncra.tifr.res.in/jobs/academic/pdf
    list: { item: '.card .list-group > .list-group-item.d-flex', title: 'a.flex-grow-1', link: 'a.flex-grow-1' }
    detail: { text: '.content-body' }
    categories: [postdoc]
    fields: [astro-ph]

  - id: cmi
    name: CMI Chennai
    adapter: link-out
    url: https://www.cmi.ac.in/positions/
    institution: Chennai Mathematical Institute
    country: IN
    note: Refused connections on ports 443 and 80 from the Mac and from a GitHub runner on 2026-11-24. Re-probe and switch to html-page when it answers.

  # ISI Kolkata: connection timeouts from GitHub runners on 22 Nov and twice on 24 Nov (robots.txt
  # unreachable, so nothing is fetched); answers from the Mac. Disabled like NCBS, with a link-out.
  - id: isi-kolkata
    enabled: false
    name: ISI Kolkata
    adapter: html-table
    institution: Indian Statistical Institute, Kolkata
    country: IN
    url: https://www.isical.ac.in/public/jobs
    table: table.table-list
    columns: { title: [title, body], advertisement no: ref, issue date: posted, applicationsubmissiondeadline: deadline, action: link }
    titleSelector: a.post-title     # the cell also holds a two-line description
    detail: { text: '.content-box' }
    exclude: 'doctor|ophthalmolog|consultant \(legal\)|security|driver|clerk'

  - id: isi-kolkata-linkout
    name: ISI Kolkata
    adapter: link-out
    url: https://www.isical.ac.in/public/jobs
    institution: Indian Statistical Institute, Kolkata
    country: IN
    note: Connection timeouts from GitHub runners (22 Nov, and twice on 24 Nov), robots.txt included; answers from a residential connection. The crawl config is kept (enabled false) for when it answers.

  - id: isi-bangalore
    name: ISI Bangalore
    adapter: html-list
    institution: Indian Statistical Institute, Bangalore
    country: IN
    url: https://www.isibang.ac.in/
    # No jobs page: the homepage's left bar lists the notifications, one PDF each.
    list: { item: '#leftbar li:has(a[href*="Job_Notifications"])', title: 'a', link: 'a', pdf: 'a[href$=".pdf"]' }
    exclude: 'application format|instructions|corrigendum|doctor|physician|consultant|engineer'

  - id: aries
    name: ARIES Nainital
    adapter: html-list
    institution: Aryabhatta Research Institute of Observational Sciences
    country: IN
    url: https://www.aries.res.in/opportunities/project-position
    # Very slow host (one request hung 18 min in the 22 Nov audit): short watchdog on top of the
    # 10 s connect / 45 s request timeouts. Needs config/ca/globalsign-gcc-r46-alphassl-2025.pem.
    timeoutMin: 5
    # Current adverts are boxes above the table; the table keeps the older ones.
    list: { item: '.node__content .address > div:has(a), .node__content table td:has(a)', title: 'a', link: 'a' }
    exclude: '^past\b|result|selected|selection|short-?listed'
    detail: { text: 'article, .node__content, main' }
    fields: [astro-ph]

  - id: niser-fixed-term
    name: NISER Bhubaneswar
    adapter: html-table
    institution: National Institute of Science Education and Research
    country: IN
    url: https://www.niser.ac.in/career/staff/ft/cr
    columns: { section: subject, description: [title, link, pdf], deadline: deadline }
    # robots.txt disallows /storage/, where the adverts are: index the list text, link the PDF.
    pdfs: false

  - id: jncasr
    name: JNCASR Bengaluru
    adapter: html-table
    institution: Jawaharlal Nehru Centre for Advanced Scientific Research
    country: IN
    url: https://www.jncasr.ac.in/announcements
    columns: { title: [title, link], date: posted }
    match: 'research associate|post-?doc|\bRA\b|faculty|fellow|JRF|SRF|project (associate|scientist)'
    # robots.txt disallows /sites/default/files/ (the attachments): the detail page text only.
    detail: { text: '.notice-b' }
    pdfs: false

  - id: iia
    name: IIA Bengaluru
    adapter: html-table
    institution: Indian Institute of Astrophysics
    country: IN
    url: https://www.iiap.res.in/iia_jobs/
    # By position: the label "post" would also match "POSTED ON".
    columns: { '#1': title, job id: ref, posted on: posted, last date: deadline, view details: [link, pdf] }
    # robots.txt disallows /*.pdf$: the list text is indexed, the advert linked, never fetched.
    pdfs: false
